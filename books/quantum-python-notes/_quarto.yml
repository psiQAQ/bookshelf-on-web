project:
  type: book
  output-dir: _book
book:
  title: Python 量子化学：全栈编程指南（中文直译）
  chapters:
  - index.qmd
  - chapters/00-preface.qmd
  - chapters/01-environment.qmd
  - chapters/02-data.qmd
  - chapters/03-visualization.qmd
  - chapters/04-scientific-tools.qmd
  - chapters/05-metaprogramming.qmd
  - chapters/06-io.qmd
  - chapters/07-cloud.qmd
  - chapters/08-ffi.qmd
  - chapters/09-performance.qmd
  - chapters/10-parallel.qmd
  - chapters/11-gpu.qmd
  - chapters/12-integrals.qmd
  - chapters/13-mean-field.qmd
  - chapters/14-fci.qmd
  - chapters/15-coupled-cluster.qmd
  - chapters/16-properties.qmd
  page-navigation: true
  reader-mode: true
  search: true
format:
  html:
    lang: zh-CN
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: scroll
    include-in-header:
    - text: '<style>mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 0.25em
        0; } img { max-width: 100%; height: auto; } .page-columns, #quarto-document-content, main.content { min-width: 0;
        } #quarto-document-content p, #quarto-document-content li, #quarto-document-content td { overflow-wrap: anywhere;
        }</style>'
execute:
  enabled: false
  eval: false
