project:
  type: book
  output-dir: _book
book:
  title: A Tiny Vector Notebook
  chapters:
  - index.qmd
  - chapters/01-length.qmd
  page-navigation: true
  reader-mode: false
  search: true
  sidebar:
    header: <div class="qs-home"><a class="qs-home-link" href="">← 返回书库</a></div>
  page-footer: <a class="qs-home-link" href="">← 返回书库</a>
format:
  html:
    lang: en
    theme:
      light: cosmo
      dark: darkly
    html-math-method: mathjax
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: scroll
    lightbox: true
    include-in-header:
    - text: "<style>mjx-container[display=\"true\"] { max-width: 100%; overflow-x:\
        \ auto; overflow-y: hidden; padding: 0.25em 0; } img { max-width: 100%; height:\
        \ auto; } .page-columns, #quarto-document-content, main.content { min-width:\
        \ 0; } #quarto-document-content p, #quarto-document-content li, #quarto-document-content\
        \ td { overflow-wrap: anywhere; } .qs-home { margin: 0.25rem 0 0.5rem; } a.qs-home-link\
        \ { display: inline-block; padding: 0.15em 0.6em; border-radius: 4px; border:\
        \ 1px solid rgba(128, 128, 128, 0.45); font-size: 0.9rem; text-decoration:\
        \ none; } a.qs-home-link:hover { text-decoration: underline; } .nav-footer\
        \ a.qs-home-link { margin-top: 0.5rem; }</style><script>\ndocument.addEventListener(\"\
        DOMContentLoaded\", function () {\n  var m = window.location.pathname.match(/^(.*\\\
        /)books\\/[^\\/]+\\//);\n  if (!m) { return; }\n  document.querySelectorAll(\"\
        a.qs-home-link\").forEach(function (a) {\n    a.href = m[1] + \"index.html\"\
        ;\n  });\n});\n</script>"
execute:
  enabled: false
  eval: false
